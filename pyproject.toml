[project]
name = "mba-ia-desafio-criacao-agente"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[db]==2.9.1",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.3",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
